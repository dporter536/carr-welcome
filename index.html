<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Welcome – Carrick-a-Rede Retreat</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Montserrat,sans-serif;
  color:white;
  background:black;
}

body{
  position:relative;
}

/* BACKGROUND */

.stage{
  position:fixed;
  inset:0;
  overflow:hidden;
}

.slide{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center center;
  opacity:0;
  transition:opacity 2s ease;
}

.slide.active{
  opacity:1;
}

.overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,0.25),
      rgba(0,0,0,0.45)
    );
}

/* LOGO */

.brand{
  position:absolute;
  top:28px;
  left:28px;
  z-index:10;

  padding:18px 28px;

  border-radius:24px;

  background:
    linear-gradient(
      135deg,
      rgba(85,95,105,0.55),
      rgba(40,46,52,0.60)
    );

  backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,0.12);

  box-shadow:
    0 12px 40px rgba(0,0,0,0.32);

  display:flex;
  align-items:center;
  justify-content:center;
}

.brand img{
  height:58px;
  opacity:1;

  filter:
    brightness(2.6)
    contrast(1.15);
}

/* MAIN CARD */

.wrap{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{

  width:900px;
  max-width:88%;

  padding:55px 60px;

  border-radius:34px;

  background:
    linear-gradient(
      135deg,
      rgba(60,70,78,0.42),
      rgba(20,22,24,0.48)
    );

  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,0.08);

  box-shadow:
    0 20px 60px rgba(0,0,0,0.30);

  text-align:center;
}

/* TEXT */

h1{
  margin:0;
  font-size:76px;
  line-height:1.04;
  font-weight:700;
  letter-spacing:-2px;
}

.guest-name{
  display:block;
  white-space:nowrap;
}

h2{
  margin-top:18px;
  font-size:32px;
  font-weight:600;
  opacity:0.98;
}

.meta{
  margin-top:38px;
  font-size:24px;
  line-height:1.5;
  opacity:0.96;
}

.extra{
  margin-top:14px;
  font-size:18px;
  opacity:0.78;
}

.temp{
  margin-top:34px;
  font-size:20px;
  opacity:0.88;
}

/* QR SECTION */

.qr-wrap{
  position:absolute;
  right:26px;
  bottom:26px;

  z-index:10;

  display:flex;
  gap:16px;
}

.qr-card{

  width:120px;

  padding:12px;

  border-radius:22px;

  background:
    linear-gradient(
      180deg,
      rgba(42,48,55,0.58),
      rgba(18,20,22,0.66)
    );

  backdrop-filter:blur(16px);

  border:1px solid rgba(255,255,255,0.08);

  text-align:center;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.30);
}

.qr-card img{
  width:88px;
  height:88px;
  border-radius:10px;
  background:white;
  padding:5px;
}

.qr-title{
  margin-top:10px;
  font-size:14px;
  font-weight:600;
}

.qr-sub{
  margin-top:4px;
  font-size:11px;
  opacity:0.72;
  line-height:1.35;
}

</style>

</head>

<body>

<div class="stage">

  <div class="slide active"
       style="background-image:url('assets/DJI_0868.JPG')">
  </div>

  <div class="slide"
       style="background-image:url('assets/DJI_0970.JPG')">
  </div>

  <div class="slide"
       style="background-image:url('assets/IMG_4182-EDIT-1.jpg')">
  </div>

  <div class="overlay"></div>

</div>

<!-- LOGO -->

<div class="brand">

  <img src="assets/logo.png">

</div>

<!-- MAIN CONTENT -->

<div class="wrap">

  <div class="card">

    <h1 id="headline">
      Welcome
    </h1>

    <h2 id="subheadline">
      to Carrick-a-Rede Retreat
    </h2>

    <div class="meta" id="meta">
      Loading your stay…
    </div>

    <div class="extra" id="extra"></div>

    <div class="temp" id="tempInfo"></div>

  </div>

</div>

<!-- QR CODES -->

<div class="qr-wrap">

  <!-- WIFI -->

  <div class="qr-card">

    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=WIFI:T:WPA;S:Carrick-a-Rede-Retreat;P:12345678910;;"
    >

    <div class="qr-title">
      WiFi
    </div>

    <div class="qr-sub">
      Scan to connect
    </div>

  </div>

  <!-- WHATSAPP -->

  <div class="qr-card">

    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://wa.me/message/5ZQ35SM2BHFIE1"
    >

    <div class="qr-title">
      WhatsApp Support
    </div>

    <div class="qr-sub">
      Message us anytime
    </div>

  </div>

</div>

<script>

/* API */

const API =
'https://script.google.com/macros/s/AKfycby8ZTL2LoFxGjKrVHIsShHb1Z722mZxUvi0YyHXuuTgBEn2XCtMyfny7tvuEIzn0STAEg/exec';

/* CABIN */

const params =
new URLSearchParams(window.location.search);

const cabin =
params.get('cabin') || 'C1';

/* LOAD DATA */

fetch(API + '?cabin=' + cabin + '&v=' + Date.now())

.then(r => r.json())

.then(data => {

  console.log(data);

  /* GUEST */

  if(data.guestName){

    document.getElementById('headline').innerHTML =
      'Welcome<br><span class="guest-name">' +
      data.guestName +
      '</span>';

    document.getElementById('subheadline').innerText =
      cabin.replace('C','Cabin ');

    document.getElementById('meta').innerText =
      'Night ' +
      data.stayNight +
      ' · Checkout ' +
      data.checkoutPretty +
      ' · ' +
      data.checkoutTimePretty;

    document.getElementById('extra').innerText =
      'Relax, switch off and enjoy the views.';

  }

  else{

    document.getElementById('headline').innerHTML =
      'Welcome';

    document.getElementById('subheadline').innerText =
      'to Carrick-a-Rede Retreat';

    document.getElementById('meta').innerText =
      'We hope you have a lovely stay.';

  }

  /* TEMPERATURE */

  if(data.sensor && data.sensor.available){

    document.getElementById('tempInfo').innerText =
      'Inside ' +
      data.sensor.temperature +
      '°C · Humidity ' +
      data.sensor.humidity +
      '%';

  }

})

.catch(err => {

  console.log(err);

});

/* SLIDESHOW */

const slides =
document.querySelectorAll('.slide');

let current = 0;

setInterval(() => {

  slides[current].classList.remove('active');

  current =
    (current + 1) % slides.length;

  slides[current].classList.add('active');

}, 8000);

</script>

</body>

</html>
