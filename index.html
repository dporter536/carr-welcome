<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Welcome – Carrick-a-Rede Retreat</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Montserrat,sans-serif;
  color:white;
  background:black;
}

body{
  position:relative;
}

/* BACKGROUND */

.stage{
  position:fixed;
  inset:0;
  overflow:hidden;
}

.slide{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center center;
  opacity:0;
  transition:opacity 1.5s ease;
}

.slide.active{
  opacity:1;
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.38);
}

/* BRAND */

.brand{
  position:absolute;
  top:36px;
  left:36px;
  z-index:10;

  display:flex;
  align-items:center;
  gap:20px;

  padding:14px 20px;
  border-radius:18px;

  background:rgba(0,0,0,0.28);
  backdrop-filter:blur(8px);
}

.brand img{
  height:68px;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,0.9));
}

.brand-text{
  font-size:28px;
  font-weight:600;
  letter-spacing:2px;
}

/* MAIN CARD */

.wrap{
  position:relative;
  z-index:5;

  width:100%;
  height:100%;

  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:980px;
  max-width:88%;

  padding:56px 64px;

  border-radius:30px;

  background:rgba(30,30,30,0.45);

  backdrop-filter:blur(16px);

  border:1px solid rgba(255,255,255,0.12);

  text-align:center;
}

.main-title{
  font-size:76px;
  font-weight:700;
  line-height:1;
  margin:0;
  letter-spacing:-2px;
}

.guest-name{
  margin-top:18px;
  font-size:50px;
  font-weight:600;
}

.subheading{
  margin-top:14px;
  font-size:34px;
  font-weight:600;
  opacity:0.95;
}

.meta{
  margin-top:28px;
  font-size:26px;
  opacity:0.95;
}

.extra{
  margin-top:18px;
  font-size:22px;
  opacity:0.82;
}

.temp{
  margin-top:30px;
  font-size:24px;
  opacity:0.85;
}

/* QR SECTION */

.qr-row{
  position:absolute;
  right:28px;
  bottom:28px;

  z-index:20;

  display:flex;
  gap:16px;
}

.qr-card{
  width:120px;

  padding:12px;

  border-radius:20px;

  background:rgba(28,34,38,0.45);

  backdrop-filter:blur(14px);

  border:1px solid rgba(255,255,255,0.08);

  box-shadow:
    0 10px 30px rgba(0,0,0,0.35);

  text-align:center;
}

.qr-card img{
  width:100%;
  border-radius:12px;
  background:white;
  padding:6px;
  box-sizing:border-box;
}

.qr-title{
  margin-top:10px;
  font-size:15px;
  font-weight:600;
  letter-spacing:0.5px;
}

.qr-sub{
  margin-top:4px;
  font-size:12px;
  opacity:0.72;
  line-height:1.3;
}

</style>

</head>

<body>

<div class="stage">

  <div class="slide active"
       style="background-image:url('assets/DJI_0868.JPG')">
  </div>

  <div class="slide"
       style="background-image:url('assets/DJI_0970.JPG')">
  </div>

  <div class="slide"
       style="background-image:url('assets/IMG_4182-EDIT-1.jpg')">
  </div>

  <div class="overlay"></div>

</div>

<!-- BRAND -->

<div class="brand">

  <img src="assets/logo.png">

  <div class="brand-text">
    CAUSEWAY COAST
  </div>

</div>

<!-- MAIN -->

<div class="wrap">

  <div class="card">

    <div class="main-title">
      Welcome
    </div>

    <div class="guest-name" id="guestName">
      to Carrick-a-Rede Retreat
    </div>

    <div class="subheading" id="subheading">
      Cabin 1
    </div>

    <div class="meta" id="meta">
      Loading your stay…
    </div>

    <div class="extra" id="extra">
    </div>

    <div class="temp" id="tempInfo">
    </div>

  </div>

</div>

<!-- QR CODES -->

<div class="qr-row">

  <div class="qr-card">

    <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=WIFI:T:WPA;S=Carrick-a-Rede Retreat;P=YOURPASSWORDHERE;;">

    <div class="qr-title">
      WiFi
    </div>

    <div class="qr-sub">
      Scan to connect
    </div>

  </div>

  <div class="qr-card">

    <img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://wa.me/447000000000">

    <div class="qr-title">
      WhatsApp Support
    </div>

    <div class="qr-sub">
      Message us anytime
    </div>

  </div>

</div>

<script>

/* API */

const API =
'https://script.google.com/macros/s/AKfycby8ZTL2LoFxGjKrVHIsShHb1Z722mZxUvi0YyHXuuTgBEn2XCtMyfny7tvuEIzn0STAEg/exec';

/* CABIN */

const params =
new URLSearchParams(window.location.search);

const cabin =
params.get('cabin') || 'C1';

const forceTime =
params.get('forceTime');

/* BUILD API URL */

let apiUrl =
API + '?cabin=' +
encodeURIComponent(cabin) +
'&v=' + Date.now();

if(forceTime){
  apiUrl += '&forceTime=' +
  encodeURIComponent(forceTime);
}

/* LOAD */

fetch(apiUrl)

.then(r => r.json())

.then(data => {

  console.log(data);

  document.getElementById('subheading').innerText =
    cabin.replace('C','Cabin ');

  /* GUEST */

  if(data.guestName){

    document.getElementById('guestName').innerText =
      data.guestName;

    document.getElementById('meta').innerText =
      'Night ' +
      data.stayNight +
      ' · Checkout ' +
      data.checkoutPretty +
      ' · ' +
      data.checkoutTimePretty;

    document.getElementById('extra').innerText =
      'Relax, switch off and enjoy the views.';

  }

  else{

    document.getElementById('guestName').innerText =
      'to Carrick-a-Rede Retreat';

    document.getElementById('meta').innerText =
      'We hope you have a lovely stay.';

  }

  /* TEMPERATURE */

  if(data.sensor && data.sensor.available){

    document.getElementById('tempInfo').innerText =
      'Inside ' +
      data.sensor.temperature +
      '°C · Humidity ' +
      data.sensor.humidity +
      '%';

  }

})

.catch(err => {

  console.log(err);

});

/* SLIDESHOW */

const slides =
document.querySelectorAll('.slide');

let current = 0;

setInterval(() => {

  slides[current].classList.remove('active');

  current =
    (current + 1) % slides.length;

  slides[current].classList.add('active');

}, 8000);

</script>

</body>
</html>
