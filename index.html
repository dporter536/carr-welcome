<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Welcome – Carrick-a-Rede Retreat</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Montserrat,sans-serif;
  color:white;
  background:black;
}

body{
  position:relative;
}

/* BACKGROUND */

.stage{
  position:fixed;
  inset:0;
  overflow:hidden;
}

.slide{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center center;
  opacity:0;
  transition:opacity 2s ease;
}

.slide.active{
  opacity:1;
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.28);
}

/* LOGO */

.brand{
  position:absolute;
  top:22px;
  left:22px;
  z-index:10;

  padding:14px 22px;

  border-radius:20px;

  background:rgba(70,80,95,0.35);

  backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,0.08);
}

.brand img{
  height:52px;
  opacity:0.95;
}

/* MAIN CARD */

.wrap{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{

  width:760px;
  max-width:84%;

  padding:42px;

  border-radius:34px;

  background:rgba(45,48,55,0.38);

  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,0.08);

  text-align:center;
}

h1{
  margin:0;
  font-size:72px;
  line-height:1.05;
  font-weight:700;
}

h2{
  margin-top:18px;
  font-size:34px;
  font-weight:600;
}

.meta{
  margin-top:30px;
  font-size:22px;
  opacity:0.96;
}

.extra{
  margin-top:14px;
  font-size:18px;
  opacity:0.84;
}

.temp{
  margin-top:28px;
  font-size:20px;
  opacity:0.82;
}

/* QR CODES */

.qr-wrap{
  position:absolute;
  right:20px;
  bottom:20px;
  z-index:20;

  display:flex;
  gap:12px;
}

.qr-card{

  width:92px;

  padding:10px;

  border-radius:20px;

  background:rgba(40,42,48,0.55);

  backdrop-filter:blur(14px);

  border:1px solid rgba(255,255,255,0.08);

  text-align:center;
}

.qr-card img{
  width:100%;
  border-radius:8px;
  background:white;
}

.qr-title{
  margin-top:8px;
  font-size:15px;
  font-weight:700;
}

.qr-sub{
  margin-top:2px;
  font-size:11px;
  opacity:0.8;
  line-height:1.25;
}

/* TV OPTIMISATION */

@media (max-height: 900px){

  .card{
    transform:scale(0.9);
  }

}

</style>

</head>

<body>

<div class="stage">

  <div class="slide active"
       style="background-image:url('assets/DJI_0868.JPG')">
  </div>

  <div class="slide"
       style="background-image:url('assets/DJI_0970.JPG')">
  </div>

  <div class="slide"
       style="background-image:url('assets/IMG_4182-EDIT-1.jpg')">
  </div>

  <div class="overlay"></div>

</div>

<!-- LOGO -->

<div class="brand">

  <img src="assets/logo.png">

</div>

<!-- MAIN CARD -->

<div class="wrap">

  <div class="card">

    <h1 id="headline">
      Welcome
    </h1>

    <h2 id="subheadline">
      to Carrick-a-Rede Retreat
    </h2>

    <div class="meta" id="meta">
      Loading your stay...
    </div>

    <div class="extra" id="extra">
    </div>

    <div class="temp" id="tempInfo">
    </div>

  </div>

</div>

<!-- QR CODES -->

<div class="qr-wrap">

  <!-- WIFI -->

  <div class="qr-card">

    <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=WIFI:T:WPA;S:Carrick-a-Rede-Retreat;P:12345678910;;">

    <div class="qr-title">
      WiFi
    </div>

    <div class="qr-sub">
      Scan to connect
    </div>

  </div>

  <!-- WHATSAPP -->

  <div class="qr-card">

    <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=https://wa.me/message/5ZQ35SM2BHFIE1">

    <div class="qr-title">
      WhatsApp Support
    </div>

    <div class="qr-sub">
      Message us anytime
    </div>

  </div>

</div>

<script>

/* API */

const API =
'https://script.google.com/macros/s/AKfycby8ZTL2LoFxGjKrVHIsShHb1Z722mZxUvi0YyHXuuTgBEn2XCtMyfny7tvuEIzn0STAEg/exec';

/* URL PARAMS */

const params =
new URLSearchParams(window.location.search);

const cabin =
params.get('cabin') || 'C1';

const forceTime =
params.get('forceTime');

/* LOAD DATA */

let url =
API + '?cabin=' + cabin + '&v=' + Date.now();

if(forceTime){
  url += '&forceTime=' + forceTime;
}

fetch(url)

.then(r => r.json())

.then(data => {

  console.log(data);

  /* GUEST */

  if(data.guestName){

    document.getElementById('headline').innerText =
      'Welcome';

    document.getElementById('subheadline').innerText =
      data.guestName;

    document.getElementById('meta').innerText =
      cabin.replace('C','Cabin ');

    document.getElementById('extra').innerText =
      'Night ' +
      data.stayNight +
      ' · Checkout ' +
      data.checkoutPretty +
      ' · ' +
      data.checkoutTimePretty;

  }

  else{

    document.getElementById('headline').innerText =
      'Welcome';

    document.getElementById('subheadline').innerText =
      'to Carrick-a-Rede Retreat';

    document.getElementById('meta').innerText =
      'We hope you have a lovely stay.';

  }

  /* TEMPERATURE */

  if(data.sensor && data.sensor.available){

    document.getElementById('tempInfo').innerText =
      'Inside ' +
      data.sensor.temperature +
      '°C · Humidity ' +
      data.sensor.humidity +
      '%';

  }

})

.catch(err => {

  console.log(err);

});

/* SLIDESHOW */

const slides =
document.querySelectorAll('.slide');

let current = 0;

setInterval(() => {

  slides[current].classList.remove('active');

  current =
    (current + 1) % slides.length;

  slides[current].classList.add('active');

}, 8000);

</script>

</body>

</html>
